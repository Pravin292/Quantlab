[project]
name = "quantlab"
version = "0.1.0"
description = "Intraday quantitative research platform for NSE and US equities on 5-minute OHLCV data"
requires-python = ">=3.12"

[tool.pytest.ini_options]
# Lets tests do "from quantlab import ..." without installing the package.
pythonpath = ["src"]
testpaths = ["tests"]
