[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.2.0"
description = "Intraday quantitative research platform for NSE and US equities on 5-minute OHLCV data, with a reusable test of equal volatility in the open, middle and close (C3)"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.13"]

[project.optional-dependencies]
research = ["pyarrow>=15", "statsmodels>=0.14", "plotly>=5.20", "pytest>=8"]

[project.scripts]
quantlab-h1 = "quantlab.h1tool:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Lets tests do "from quantlab import ..." without installing the package.
pythonpath = ["src"]
testpaths = ["tests"]
